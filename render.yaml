# Render blueprint for Liftoff Cloud (the web app in cloud/) and its test
# browser (proof/), a private service the purchase test runs on.
# New > Blueprint in the Render dashboard, pick this repo, then fill in the
# values marked sync: false. See cloud/README.md.
envVarGroups:
  # Shared by the web app and the test browser: signs every request between them.
  - name: liftoff-proof
    envVars:
      - key: LIFTOFF_PROOF_SECRET
        generateValue: true
services:
  - type: web
    name: liftoff-cloud
    runtime: node
    plan: starter # a persistent disk needs a paid instance
    buildCommand: cd cloud && npm ci --omit=dev
    startCommand: node cloud/server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: liftoff-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LIFTOFF_DATA_DIR
        value: /var/data
      # Encrypts stored keys and signs cookies. Keep it: changing it makes stored keys unreadable.
      - key: LIFTOFF_CLOUD_SECRET
        generateValue: true
      # Runs Claude (Managed Agents). The agent and its sandbox are created on first start.
      - key: ANTHROPIC_API_KEY
        sync: false
      # A GitHub OAuth app with callback URL https://<your service>.onrender.com/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Spending cap per run, in US dollars (people see it in tokens).
      - key: LIFTOFF_RUN_BUDGET_USD
        value: "15"
      # What people call the assistant, and how many tokens they see per dollar of model spend.
      - key: LIFTOFF_ASSISTANT_NAME
        value: Pilot
      - key: LIFTOFF_TOKENS_PER_USD
        value: "100"
      # Liftoff's test browser, over Render's private network.
      - fromGroup: liftoff-proof
      - key: LIFTOFF_PROOF_URL
        fromService:
          type: pserv
          name: liftoff-proof
          property: hostport

  # Runs the purchase test in Chromium, one app at a time. No public address,
  # no disk, no keys. Keep it in the same region as liftoff-cloud.
  - type: pserv
    name: liftoff-proof
    runtime: docker
    plan: starter # 512 MB; use standard if tests stop with "out of memory"
    dockerfilePath: ./proof/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - fromGroup: liftoff-proof
