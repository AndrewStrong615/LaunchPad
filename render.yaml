# Render blueprint for Liftoff Cloud (the web app in cloud/).
# New > Blueprint in the Render dashboard, pick this repo, then fill in the
# values marked sync: false. See cloud/README.md.
services:
  - type: web
    name: liftoff-cloud
    runtime: node
    plan: starter # a persistent disk needs a paid instance
    buildCommand: cd cloud && npm ci --omit=dev
    startCommand: node cloud/server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: liftoff-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LIFTOFF_DATA_DIR
        value: /var/data
      # Encrypts stored keys and signs cookies. Keep it: changing it makes stored keys unreadable.
      - key: LIFTOFF_CLOUD_SECRET
        generateValue: true
      # Runs Claude (Managed Agents). The agent and its sandbox are created on first start.
      - key: ANTHROPIC_API_KEY
        sync: false
      # A GitHub OAuth app with callback URL https://<your service>.onrender.com/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Spending cap per run, in US dollars.
      - key: LIFTOFF_RUN_BUDGET_USD
        value: "15"
