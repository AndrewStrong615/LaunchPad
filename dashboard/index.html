<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --surface-2: #fafafa; --ink: #18181b; --ink-2: #3f3f46; --muted: #71717a; --faint: #a1a1aa;
    --line: #e4e4e7; --line-2: #f0f0f2; --hover: #f4f4f5;
    --accent: #5b5bd6; --accent-ink: #ffffff; --accent-soft: #eeeefc;
    --good: #15803d; --good-soft: #e8f6ec; --good-dot: #22c55e;
    --warn: #b45309; --warn-soft: #fdf3e2;
    --bad: #c0262d; --bad-soft: #fdecec;
    --run: #1d63d6; --run-soft: #e8f0fd;
    --shadow: 0 1px 2px rgba(16, 16, 24, .04), 0 1px 1px rgba(16, 16, 24, .02);
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10; --surface: #161618; --surface-2: #1b1b1e; --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1aa; --faint: #71717a;
      --line: #27272a; --line-2: #1f1f22; --hover: #202023;
      --accent: #8b8bf0; --accent-ink: #0e0e10; --accent-soft: #23233a;
      --good: #4ade80; --good-soft: #13291b; --good-dot: #22c55e;
      --warn: #fbbf24; --warn-soft: #2d2412;
      --bad: #f87171; --bad-soft: #2f1517;
      --run: #7aa7ff; --run-soft: #16223a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--surface-2) 247px, var(--line) 247px 248px, transparent 248px); }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; border-right: 1px solid var(--line); background: var(--surface-2); overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; font-weight: 600; letter-spacing: -.01em; }
  .brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
  .brand .mark svg { width: 15px; height: 15px; }
  .nav-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 14px 8px 6px; display: flex; justify-content: space-between; }
  .nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: 7px; background: none; text-align: left; cursor: pointer; color: var(--ink-2); min-height: 34px; }
  .nav:hover { background: var(--hover); }
  .nav.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); font-weight: 500; }
  .nav .i { color: var(--muted); }
  .nav .end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .side .foot { margin-top: auto; padding: 12px 8px 4px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  .side .foot code { font-size: 11px; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 28px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); font-size: 13px; color: var(--muted); }
  .topbar b { color: var(--ink); font-weight: 500; }
  .topbar .crumb { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); }
  .topbar .crumb:hover { color: var(--ink); }
  .topbar .sync { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .content { width: 100%; max-width: 1200px; margin: 0 auto; padding: 28px; display: flex; flex-direction: column; gap: 20px; }

  /* ---------- primitives ---------- */
  .page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); }
  .card-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-head .sub { color: var(--muted); font-size: 12px; }
  .card-head .end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .card-body { padding: 4px 16px 12px; }
  .count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--hover); color: var(--muted); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--hover); color: var(--ink-2); }
  .pill .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.run { background: var(--run-soft); color: var(--run); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .pill.sm { height: 18px; font-size: 11px; padding: 0 6px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; box-shadow: var(--shadow); }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .btn.primary:hover { opacity: .88; }
  .btn.quiet { border-color: transparent; background: none; box-shadow: none; color: var(--muted); }
  .btn.quiet:hover { background: var(--hover); color: var(--ink); }
  .btn.icon-only { width: 30px; padding: 0; }
  .btn:focus-visible, .nav:focus-visible, .row-btn:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .avatar { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; flex: none; }
  .avatar.lg { width: 44px; height: 44px; border-radius: 11px; font-size: 19px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .status-dot.live { background: var(--good-dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good-dot) 22%, transparent); }
  .status-dot.warn { background: #f59e0b; }
  .status-dot.run { background: var(--run); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; }
  code { font-family: var(--mono); font-size: 12px; background: var(--hover); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }

  .meter { height: 6px; border-radius: 999px; background: var(--line-2); overflow: hidden; display: flex; }
  .meter > span { display: block; height: 100%; }
  .meter .ok { background: var(--good-dot); }
  .meter .blk { background: var(--bad); }
  .ring { --p: 0; width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: radial-gradient(closest-side, var(--surface) 76%, transparent 78% 100%), conic-gradient(var(--good-dot) calc(var(--p) * 1%), var(--line-2) 0); }
  .ring b { font-size: 13px; font-variant-numeric: tabular-nums; }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .stat { padding: 16px 18px; border-left: 1px solid var(--line-2); }
  .stat:first-child { border-left: 0; }
  .stat .label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .stat .value { margin-top: 6px; font-size: 26px; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 14px; color: var(--faint); font-weight: 500; letter-spacing: 0; }
  .stat .hint { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .stat.alert .value { color: var(--bad); }

  /* ---------- lists ---------- */
  .rows > * + * { border-top: 1px solid var(--line-2); }
  .task { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 48px; }
  .task .tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--faint); background: none; padding: 0; cursor: pointer; display: grid; place-items: center; flex: none; color: transparent; }
  .task .tick:hover { border-color: var(--good); color: var(--good); }
  .task .tick svg { width: 11px; height: 11px; stroke-width: 3; }
  .task.done .tick { background: var(--good-dot); border-color: var(--good-dot); color: #fff; }
  .task .t { flex: 1; min-width: 0; }
  .task .t .title { color: var(--ink); }
  .task.done .t .title { color: var(--faint); text-decoration: line-through; }
  .task .t .meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .task .t .meta a { color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
  .task .t .meta a svg { width: 12px; height: 12px; }
  .task .acts { display: flex; gap: 4px; opacity: .0; transition: opacity .12s; }
  .task:hover .acts, .task:focus-within .acts { opacity: 1; }
  .add { display: flex; gap: 8px; align-items: center; padding: 12px 0 4px; flex-wrap: wrap; }
  .add input[type=text] { flex: 1; min-width: 180px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; }
  .add input[type=text]::placeholder { color: var(--faint); }
  .add label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .add input[type=checkbox] { accent-color: var(--bad); }
  .empty-row { padding: 18px 0; display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .empty-row .i { color: var(--good); }

  .line { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 48px; }
  .line .grow { flex: 1; min-width: 0; }
  .line .name { font-weight: 500; }
  .tile { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--ink-2); flex: none; }

  /* ---------- app cards (overview) ---------- */
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .app-card { text-align: left; padding: 0; cursor: pointer; display: flex; flex-direction: column; transition: border-color .12s, transform .12s; }
  .app-card:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .app-card .top { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .app-card .top .nm { font-weight: 600; font-size: 15px; }
  .app-card .top .sub { font-size: 12px; color: var(--muted); }
  .app-card .top .pill { margin-left: auto; }
  .app-card .mid { padding: 0 16px 14px; }
  .segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; margin: 6px 0 8px; }
  .segs span { height: 6px; border-radius: 2px; background: var(--line-2); }
  .segs .done, .segs .skipped { background: var(--good-dot); }
  .segs .running { background: var(--run); }
  .segs .blocked { background: var(--bad); }
  .app-card .bottom { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--muted); margin-top: auto; }
  .app-card .bottom .go { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--ink-2); }
  .flag { display: inline-flex; align-items: center; gap: 4px; color: var(--bad); font-weight: 500; }

  /* ---------- app page ---------- */
  .hero { padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; }
  .hero .id { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
  .hero h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hero .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .hero .meta span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .hero .meta .path { font-family: var(--mono); font-size: 12px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .hero .cta { display: flex; gap: 8px; align-items: flex-start; }
  .facts { grid-column: 1 / -1; display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line-2); margin: 0 -20px -20px; }
  .fact { padding: 14px 20px; border-left: 1px solid var(--line-2); }
  .fact:first-child { border-left: 0; display: flex; align-items: center; gap: 12px; }
  .fact .label { font-size: 12px; color: var(--muted); }
  .fact .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .fact .value small { font-size: 13px; color: var(--faint); font-weight: 500; }
  .fact .value.bad { color: var(--bad); }

  .roadmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 14px 16px 16px; }
  .step { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
  .step .lbl { display: flex; align-items: center; gap: 7px; font-weight: 500; font-size: 13px; }
  .step .lbl .i { width: 15px; height: 15px; }
  .step .note { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.done .lbl .i, .step.skipped .lbl .i { color: var(--good); }
  .step.running { border-color: color-mix(in srgb, var(--run) 45%, var(--line)); background: var(--run-soft); }
  .step.running .lbl .i { color: var(--run); animation: spin 1.6s linear infinite; }
  .step.blocked { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: var(--bad-soft); }
  .step.blocked .lbl .i { color: var(--bad); }
  .step.todo .lbl { color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .step.running .lbl .i { animation: none; } }

  .cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  .cat { border-top: 1px solid var(--line-2); }
  .cat:first-child { border-top: 0; }
  .cat summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; user-select: none; }
  .cat summary::-webkit-details-marker { display: none; }
  .cat summary:hover { background: var(--surface-2); }
  .cat summary .chev { color: var(--faint); transition: transform .15s; }
  .cat[open] summary .chev { transform: rotate(90deg); }
  .cat summary .nm { font-weight: 500; flex: 1; min-width: 0; }
  .cat summary .meter { width: 72px; }
  .cat summary .frac { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 64px; text-align: right; }
  .cat summary .frac.full { color: var(--good); }
  .cat .items { padding: 0 16px 10px 44px; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
  .check input { appearance: none; margin: 2px 0 0; width: 16px; height: 16px; border: 1.5px solid var(--faint); border-radius: 4px; display: grid; place-items: center; cursor: pointer; flex: none; background: var(--surface); }
  .check input:checked { background: var(--good-dot); border-color: var(--good-dot); }
  .check input:checked::after { content: ""; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
  .check .tx { flex: 1; }
  .check input:checked + .tx { color: var(--muted); }
  .check .by { font-size: 11px; color: var(--faint); }
  .check .why { display: block; font-size: 12px; color: var(--bad); margin-top: 2px; }
  .next { display: flex; gap: 14px; align-items: flex-start; padding: 16px; }
  .next .tile { flex: none; }
  .next h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .next p { margin: 2px 0 0; color: var(--ink-2); }
  .next .grow { flex: 1; min-width: 0; }
  .next .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 640px) { .next { flex-wrap: wrap; } .next .acts { justify-content: flex-start; width: 100%; } }
  .next code { font-size: 12px; background: var(--hover); padding: 2px 6px; border-radius: 5px; }
  .pulse-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; padding: 12px 0 4px; }
  .pulse-grid .label { font-size: 12px; color: var(--muted); }
  .pulse-grid .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .pulse-grid .delta { font-size: 12px; color: var(--muted); }
  .pulse-grid .delta.up { color: var(--good); }
  .pulse-grid .delta.down { color: var(--bad); }

  .deploy { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .deploy .grow { flex: 1; min-width: 0; }
  .deploy .v { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .live-link { display: flex; align-items: center; gap: 10px; padding: 12px; margin: 12px 0 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); text-decoration: none; }
  .live-link:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .live-link .host { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .timeline { position: relative; padding: 10px 0 4px; }
  .ev { position: relative; display: flex; gap: 10px; padding: 5px 0; font-size: 13px; }
  .ev::before { content: ""; position: absolute; left: 3px; top: 18px; bottom: -6px; width: 1px; background: var(--line); }
  .ev:last-child::before { display: none; }
  .ev .bul { width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; background: var(--faint); flex: none; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--surface); }
  .ev .bul.good { background: var(--good-dot); } .ev .bul.run { background: var(--run); } .ev .bul.bad { background: var(--bad); }
  .ev .msg { flex: 1; min-width: 0; color: var(--ink-2); }
  .ev .msg b { font-weight: 500; color: var(--ink); }
  .ev time { font-size: 12px; color: var(--faint); white-space: nowrap; }

  .empty { padding: 56px 24px; text-align: center; color: var(--muted); }
  .empty .tile { width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 12px; }
  .empty h2 { margin: 0 0 6px; font-size: 16px; color: var(--ink); }

  .toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }

  /* ---------- responsive ---------- */
  @media (max-width: 1040px) {
    .cols { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 820px) {
    .shell { grid-template-columns: minmax(0, 1fr); background: none; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 4px; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .side .brand { padding: 0 8px 0 0; }
    .side .brand span, .nav-label, .side .foot { display: none; }
    .side #applist { display: flex; gap: 4px; }
    .nav { width: auto; white-space: nowrap; }
    .topbar { padding: 0 16px; }
    .content { padding: 16px; gap: 16px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat:nth-child(3) { border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--line-2); }
    .hero { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0 -16px -16px; }
    .fact { padding: 12px 16px; }
    .fact:nth-child(3) { border-left: 0; }
    .fact:nth-child(n+3) { border-top: 1px solid var(--line-2); }
    .task .acts { opacity: 1; }
    .roadmap { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cat summary .meter, .card-head .end.sub { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Apps">
    <div class="brand"><span class="mark" id="brand-mark"></span><span>Mission Control</span></div>
    <button class="nav" id="nav-overview"></button>
    <button class="nav" id="nav-accounts"></button>
    <div class="nav-label"><span>Apps</span><span id="app-count"></span></div>
    <div id="applist"></div>
    <div class="foot">Add an app: open it in Claude Code and run <code>/liftoff:onboard</code></div>
  </aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <main class="content" id="main"></main>
  </div>
</div>
<script>
const state = { apps: [], accounts: [], view: 'overview', selected: null, open: {}, lastSync: null };
const $ = (id) => document.getElementById(id);

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}

// Small inline icon set (stroke icons, 24px grid).
const ICONS = {
  rocket: '<path d="M5 15c-1.5 1.5-2 5-2 5s3.5-.5 5-2c.8-.8.8-2.2 0-3s-2.2-.8-3 0z"/><path d="M9 12a22 22 0 0 1 11-9c0 3-1 7.5-9 11z"/><path d="M9 12H4s.5-3 2-4c1.6-1 5 0 5 0"/><path d="M12 15v5s3-.5 4-2c1-1.6 0-5 0-5"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M16 7l3 3M14 9l2 2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  circle: '<circle cx="12" cy="12" r="8.5"/>',
  checkCircle: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  spinner: '<path d="M12 3a9 9 0 1 0 9 9"/>',
  x: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
  minus: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  external: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  chevron: '<path d="m9 6 6 6-6 6"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',
  activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
};
function icon(name, cls = '') {
  const span = document.createElement('span');
  span.innerHTML = `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
  return span.firstChild;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'content-type': 'application/json' } });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

// ---------- helpers ----------
const PALETTE = ['#5b5bd6', '#0e9f6e', '#d9480f', '#c2255c', '#1c7ed6', '#7048e8', '#0b7285', '#a61e4d'];
function colorFor(slug) { let n = 0; for (const c of slug) n = (n * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[n % PALETTE.length]; }
function avatar(app, lg) { return h('span', { class: 'avatar' + (lg ? ' lg' : ''), style: { background: colorFor(app.slug) }, 'aria-hidden': 'true' }, app.name[0].toUpperCase()); }
function host(url) { try { return new URL(url).host; } catch { return url; } }
function doneCount(a) { return a.stepsDone + a.checksDone; }
function totalCount(a) { return a.stepsTotal + a.checksTotal; }
function pct(a) { return totalCount(a) ? Math.round((doneCount(a) / totalCount(a)) * 100) : 0; }
function toDo(a) { return totalCount(a) - doneCount(a) + a.openTasks; }
function plural(n, one, many = one + 's') { return `${n} ${n === 1 ? one : many}`; }
function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
const PLATFORM = { web: 'Web', ios: 'iOS', android: 'Android' };

function appStatus(a) {
  if (a.readyForRelease) return h('span', { class: 'pill good' }, icon('check'), 'Ready for users');
  if (a.liveUrl) return h('span', { class: 'pill good' }, h('span', { class: 'd' }), 'Live');
  if (a.steps.some((s) => s.status === 'running')) return h('span', { class: 'pill run' }, h('span', { class: 'd' }), 'In progress');
  return h('span', { class: 'pill' }, h('span', { class: 'd' }), 'Not live');
}

function meter(a) {
  const p = pct(a);
  return h('div', { class: 'meter', role: 'progressbar', 'aria-valuenow': p, 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-label': `${p}% ready` },
    h('span', { class: 'ok', style: { width: `${p}%` } }));
}

function stepSegments(a) {
  return h('div', { class: 'segs', 'aria-hidden': 'true' }, a.steps.map((s) => h('span', { class: s.status || 'todo', title: `${s.label}: ${s.status || 'todo'}` })));
}

// ---------- sidebar + topbar ----------
function renderNav() {
  $('brand-mark').replaceChildren(icon('rocket'));
  const ov = $('nav-overview');
  ov.className = 'nav' + (state.view === 'overview' ? ' on' : '');
  ov.replaceChildren(icon('grid'), 'Overview');
  const connected = state.accounts.filter((a) => a.connected).length;
  const ac = $('nav-accounts');
  ac.className = 'nav' + (state.view === 'accounts' ? ' on' : '');
  ac.replaceChildren(icon('key'), 'Accounts', h('span', { class: 'end' }, h('span', { class: 'count' }, `${connected}/${state.accounts.length}`)));
  $('app-count').textContent = state.apps.length || '';
  $('applist').replaceChildren(...state.apps.map((a) =>
    h('button', { class: 'nav' + (state.view === 'app' && state.selected === a.slug ? ' on' : ''), onclick: () => go('app', a.slug), title: a.name },
      avatar(a), h('span', {}, a.name),
      h('span', { class: 'end' },
        a.blockingTasks ? h('span', { class: 'pill bad sm', title: `${a.blockingTasks} blocking release` }, a.blockingTasks) : null,
        h('span', { class: 'status-dot' + (a.liveUrl ? ' live' : ''), title: a.liveUrl ? 'Live' : 'Not live' })))));
}

function renderTopbar(app) {
  const crumbs = [h('button', { class: 'crumb', onclick: () => go('overview') }, 'Mission Control')];
  if (state.view === 'app' && app) crumbs.push(h('span', {}, '/'), h('b', {}, app.name));
  else if (state.view === 'accounts') crumbs.push(h('span', {}, '/'), h('b', {}, 'Accounts'));
  else crumbs.push(h('span', {}, '/'), h('b', {}, 'Overview'));
  $('topbar').replaceChildren(...crumbs,
    h('span', { class: 'sync', title: 'Refreshes every few seconds' }, h('span', { class: 'status-dot live' }), state.lastSync ? 'Synced' : 'Connecting…'));
}

// ---------- overview ----------
function renderOverview() {
  if (!state.apps.length) {
    return h('div', { class: 'card empty' },
      h('div', { class: 'tile' }, icon('rocket')),
      h('h2', {}, 'No apps yet'),
      h('p', {}, 'Open an app in Claude Code and run ', h('code', {}, '/liftoff:onboard'), '. It shows up here right away.'));
  }
  const apps = state.apps;
  const live = apps.filter((a) => a.liveUrl).length;
  const blocking = apps.reduce((n, a) => n + a.blockingTasks, 0);
  const open = apps.reduce((n, a) => n + a.openTasks, 0);
  const connected = state.accounts.filter((a) => a.connected).length;
  const allTasks = apps.flatMap((a) => a.tasks.filter((t) => !t.done).map((t) => ({ ...t, app: a })))
    .sort((x, y) => y.blocksRelease - x.blocksRelease);

  return [
    h('div', { class: 'page-head' },
      h('div', {}, h('h1', {}, 'Overview'), h('p', {}, `${plural(apps.length, 'app')} on this machine. Here is what needs you first.`))),
    h('section', { class: 'stats', 'aria-label': 'Summary' },
      stat('Live', live, `/ ${apps.length}`, live === apps.length ? 'Every app is live' : `${apps.length - live} not live yet`),
      stat('Blocking release', blocking, '', blocking ? 'Clear these before you ship' : 'Nothing blocking', blocking > 0),
      stat('Your open tasks', open, '', `across ${plural(apps.filter((a) => a.openTasks).length, 'app')}`),
      stat('Accounts connected', connected, `/ ${state.accounts.length}`, 'Reused by every app')),
    h('div', { class: 'cols' },
      h('section', { class: 'card' },
        h('div', { class: 'card-head' }, h('h2', {}, 'Needs you'), h('span', { class: 'count' }, allTasks.length),
          h('span', { class: 'end sub' }, 'Release blockers first')),
        h('div', { class: 'card-body rows' },
          allTasks.length ? allTasks.map((t) => taskRow(t.app, t, true)) : h('div', { class: 'empty-row' }, icon('checkCircle'), 'Nothing waiting on you.'))),
      h('section', { class: 'card' },
        h('div', { class: 'card-head' }, h('h2', {}, 'Recent activity')),
        h('div', { class: 'card-body' }, activity(apps.flatMap((a) => a.log.map((l) => ({ ...l, app: a }))), 8, true)))),
    h('div', { class: 'page-head', style: { marginTop: '4px' } }, h('div', {}, h('h1', { style: { fontSize: '16px' } }, 'Apps'))),
    h('div', { class: 'apps' }, apps.map(appCard)),
  ];
}

function stat(label, value, of, hint, alert) {
  return h('div', { class: 'stat' + (alert ? ' alert' : '') },
    h('div', { class: 'label' }, label),
    h('div', { class: 'value' }, value, of ? h('small', {}, ' ' + of) : null),
    h('div', { class: 'hint' }, hint));
}

function appCard(a) {
  return h('button', { class: 'card app-card', onclick: () => go('app', a.slug), 'aria-label': `Open ${a.name}` },
    h('div', { class: 'top' }, avatar(a),
      h('div', { style: { minWidth: 0 } }, h('div', { class: 'nm' }, a.name), h('div', { class: 'sub' }, a.liveUrl ? host(a.liveUrl) : a.platforms.map((p) => PLATFORM[p] || p).join(' · '))),
      appStatus(a)),
    h('div', { class: 'mid' },
      h('div', { class: 'small', style: { display: 'flex', justifyContent: 'space-between' } },
        h('span', {}, 'Launch steps'), h('span', {}, `${a.stepsDone}/${a.stepsTotal}`)),
      stepSegments(a),
      h('div', { class: 'small', style: { display: 'flex', justifyContent: 'space-between', marginTop: '10px' } },
        h('span', {}, 'Release readiness'), h('span', {}, `${pct(a)}%`)),
      h('div', { style: { marginTop: '6px' } }, meter(a))),
    h('div', { class: 'bottom' },
      a.blockingTasks ? h('span', { class: 'flag' }, icon('flag'), `${a.blockingTasks} blocking`) : h('span', {}, a.readyForRelease ? 'Nothing blocking' : 'No blockers'),
      h('span', {}, `${toDo(a)} to do`),
      h('span', { class: 'go' }, 'Open', icon('arrow'))));
}

function activity(entries, limit, showApp) {
  const list = entries.slice().sort((x, y) => String(y.at).localeCompare(String(x.at))).slice(0, limit);
  if (!list.length) return h('div', { class: 'empty-row' }, 'Nothing yet.');
  return h('div', { class: 'timeline' }, list.map((l) => {
    const [what, rest] = String(l.msg).split(' → ');
    const tone = /^done|^skipped/.test(rest || '') ? 'good' : /^running/.test(rest || '') ? 'run' : /^blocked/.test(rest || '') ? 'bad' : '';
    const step = l.app?.steps.find((s) => s.id === what);
    return h('div', { class: 'ev' },
      h('span', { class: 'bul ' + tone }),
      h('div', { class: 'msg' },
        showApp ? h('b', {}, l.app.name + ' ') : null,
        rest !== undefined ? [h('span', {}, step ? step.label : what), ` ${rest.split(':')[0] === 'done' ? 'finished' : rest}`] : l.msg),
      h('time', { datetime: l.at, title: l.at ? new Date(l.at).toLocaleString() : '' }, ago(l.at)));
  }));
}

// ---------- accounts ----------
function accountRows(accounts) {
  return h('div', { class: 'rows' }, accounts.filter(Boolean).map((a) => h('div', { class: 'line' },
    h('span', { class: 'tile' }, a.label.split(/\s|\(/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase()),
    h('div', { class: 'grow' }, h('div', { class: 'name' }, a.label), h('div', { class: 'small' }, a.connected ? `Connected ${a.connectedAt ? ago(a.connectedAt) : ''}`.trim() : a.note)),
    a.connected
      ? h('span', { class: 'pill good' }, icon('check'), 'Connected')
      : h('button', { class: 'btn', title: 'Copy the command that connects it', onclick: () => copy(`liftoff accounts connect ${a.id}`) }, icon('copy'), 'Connect'))));
}

function renderAccounts() {
  const connected = state.accounts.filter((a) => a.connected);
  const rest = state.accounts.filter((a) => !a.connected);
  return [
    h('div', { class: 'page-head' }, h('div', {},
      h('h1', {}, 'Accounts'),
      h('p', {}, 'Connected once on this machine and reused by every app. Keys stay in ', h('code', {}, '~/.liftoff/credentials.env'), '.'))),
    h('div', { class: 'cols' },
      h('section', { class: 'card' },
        h('div', { class: 'card-head' }, h('h2', {}, 'Not connected'), h('span', { class: 'count' }, rest.length),
          h('span', { class: 'end sub' }, 'Connect copies the command')),
        h('div', { class: 'card-body' }, rest.length ? accountRows(rest) : h('div', { class: 'empty-row' }, icon('checkCircle'), 'Everything is connected.'))),
      h('section', { class: 'card' },
        h('div', { class: 'card-head' }, h('h2', {}, 'Connected'), h('span', { class: 'count' }, connected.length)),
        h('div', { class: 'card-body' }, connected.length ? accountRows(connected) : h('div', { class: 'empty-row' }, 'None yet.')))),
  ];
}

// ---------- one app ----------
function money(n, cur = 'usd') {
  if (n === null || n === undefined) return '–';
  return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur.toUpperCase(), maximumFractionDigits: n >= 1000 ? 0 : 2 }).format(n);
}
function pulseTile(label, value, delta, dir) {
  return h('div', {}, h('div', { class: 'label' }, label), h('div', { class: 'value' }, value),
    delta ? h('div', { class: 'delta' + (dir ? ` ${dir}` : '') }, delta) : null);
}
function pulseCard(app) {
  const p = app.pulse;
  const refreshBtn = h('button', { class: 'btn quiet', onclick: (e) => { e.target.disabled = true; mutate(`/api/apps/${app.slug}/pulse`, 'POST'); } }, icon('activity'), 'Refresh');
  const head = h('div', { class: 'card-head' }, h('h2', {}, 'Pulse'), p ? h('span', { class: 'sub' }, ago(p.at)) : null, h('span', { class: 'end' }, refreshBtn));
  if (!p) return h('section', { class: 'card' }, head, h('div', { class: 'card-body' }, h('div', { class: 'empty-row' }, 'No numbers yet. Refresh once Stripe or RevenueCat, PostHog and Sentry are connected.')));
  const tiles = [];
  const rev = p.revenuecat?.mrr ?? p.stripe?.mrr;
  const cur = p.revenuecat?.currency || p.stripe?.currency || 'usd';
  if (rev !== undefined && rev !== null) {
    const ch = p.change?.mrr;
    tiles.push(pulseTile('MRR', money(rev, cur), ch !== null && ch !== undefined ? `${ch >= 0 ? '+' : ''}${money(ch, cur)} vs last week` : null, ch > 0 ? 'up' : ch < 0 ? 'down' : null));
  }
  const subs = p.revenuecat?.activeSubscriptions ?? p.stripe?.activeSubscriptions;
  if (subs !== undefined && subs !== null) tiles.push(pulseTile('Subscribers', subs, p.stripe ? `+${p.stripe.newSubscriptions7d} new, −${p.stripe.cancellations7d} cancelled (7d)` : null));
  if (p.posthog) {
    const hh = p.posthog;
    const d = hh.signups7d - hh.signupsPrev7d;
    tiles.push(pulseTile('Sign-ups (7d)', hh.signups7d, `${d >= 0 ? '+' : ''}${d} vs last week`, d > 0 ? 'up' : d < 0 ? 'down' : null));
    tiles.push(pulseTile('Paywall → Pro', hh.paywallViews7d ? `${Math.round((hh.upgrades7d / hh.paywallViews7d) * 1000) / 10}%` : '–', `${hh.upgrades7d} of ${hh.paywallViews7d} views`));
  }
  if (p.sentry) {
    const cf = p.sentry.crashFreeSessions;
    tiles.push(pulseTile('Crash-free', cf !== null && cf !== undefined ? `${Math.round(cf * 1000) / 10}%` : '–', `${p.sentry.newIssues7d} new issues (7d)`, cf !== null && cf < 0.99 ? 'down' : null));
  }
  if (p.uptime) tiles.push(pulseTile('Site', p.uptime.up ? 'Up' : 'Down', p.uptime.up ? `${p.uptime.ms} ms` : String(p.uptime.status || p.uptime.error || ''), p.uptime.up ? 'up' : 'down'));
  if (p.stripe?.failedPayments7d) tiles.push(pulseTile('Failed payments (7d)', p.stripe.failedPayments7d, null, 'down'));
  const errs = Object.entries(p.errors || {});
  return h('section', { class: 'card' }, head, h('div', { class: 'card-body' },
    tiles.length ? h('div', { class: 'pulse-grid' }, tiles) : h('div', { class: 'empty-row' }, 'No sources answered.'),
    errs.length ? h('div', { class: 'small' }, errs.map(([k, v]) => `${k}: ${v}`).join(' · ')) : null));
}
function nextCard(app) {
  const a = app.nextAction;
  if (!a) return null;
  const cmd = a.command && a.command.startsWith('/') ? a.command : null;
  return h('section', { class: 'card next' },
    h('span', { class: 'tile' }, icon('flag')),
    h('div', { class: 'grow' },
      h('div', { class: 'small' }, 'Do this next'),
      h('h2', {}, a.title),
      h('p', {}, a.why),
      h('p', {}, a.do)),
    h('div', { class: 'acts' },
      a.url ? h('a', { class: 'btn', href: a.url, target: '_blank', rel: 'noopener' }, 'Open', icon('external')) : null,
      a.taskId ? h('button', { class: 'btn', onclick: () => mutate(`/api/apps/${app.slug}/tasks/${a.taskId}`, 'POST', { done: true }) }, 'Mark done') : null,
      cmd ? h('button', { class: 'btn', onclick: () => copy(cmd) }, icon('copy'), cmd) : null));
}

function taskRow(app, t, showApp) {
  const url = `/api/apps/${app.slug}/tasks/${t.id}`;
  return h('div', { class: 'task' + (t.done ? ' done' : '') },
    h('button', { class: 'tick', 'aria-label': t.done ? `Mark "${t.title}" not done` : `Mark "${t.title}" done`, title: t.done ? 'Undo' : 'Mark done',
      onclick: () => mutate(url, 'POST', { done: !t.done }) }, icon('check')),
    h('div', { class: 't' },
      h('div', { class: 'title' }, t.title),
      (showApp || (t.blocksRelease && !t.done) || (t.leadTime && !t.done)) ? h('div', { class: 'meta' },
        showApp ? [h('span', { class: 'avatar', style: { width: '14px', height: '14px', fontSize: '9px', borderRadius: '4px', background: colorFor(app.slug) } }, app.name[0]), h('span', {}, app.name)] : null,
        t.blocksRelease && !t.done ? h('span', { class: 'pill bad sm' }, 'Blocks release') : null,
        t.leadTime && !t.done ? h('span', { class: 'pill warn sm' }, `Takes ${t.leadTime}`) : null,
        t.url && !t.done ? h('a', { href: t.url, target: '_blank', rel: 'noopener' }, 'Start', icon('external')) : null) : null),
    h('div', { class: 'acts' },
      !t.done ? h('button', { class: 'btn', onclick: () => mutate(url, 'POST', { done: true }) }, 'Mark done') : null,
      t.done ? h('button', { class: 'btn quiet icon-only', title: 'Remove', 'aria-label': 'Remove task', onclick: () => mutate(url, 'DELETE') }, icon('trash')) : null));
}

const STEP_ICON = { done: 'checkCircle', skipped: 'minus', running: 'spinner', blocked: 'x', todo: 'circle' };
const STEP_WORD = { done: 'Done', skipped: 'Skipped', running: 'In progress', blocked: 'Blocked', todo: 'Not started' };

function renderApp(app) {
  const cats = [...new Set(app.checklist.map((c) => c.category))];
  const input = h('input', { type: 'text', placeholder: 'Add a task for yourself…', 'aria-label': 'New task', maxlength: '200' });
  const blocks = h('input', { type: 'checkbox' });
  const p = pct(app);
  const openKey = (cat) => `${app.slug}:${cat}`;

  return [
    h('section', { class: 'card hero' },
      h('div', { class: 'id' }, avatar(app, true),
        h('div', { style: { minWidth: 0 } },
          h('h1', {}, app.name, appStatus(app)),
          h('div', { class: 'meta' },
            h('span', {}, icon('layers'), app.framework),
            h('span', {}, icon(app.platforms.includes('web') && app.platforms.length === 1 ? 'globe' : 'phone'), app.platforms.map((x) => PLATFORM[x] || x).join(', ')),
            h('span', { title: app.root, style: { maxWidth: '100%' } }, icon('folder'), h('span', { class: 'path' }, app.root))))),
      h('div', { class: 'cta' },
        app.liveUrl ? h('a', { class: 'btn primary', href: app.liveUrl, target: '_blank', rel: 'noopener' }, 'Visit', icon('external')) : null),
      h('div', { class: 'facts' },
        h('div', { class: 'fact' }, h('div', { class: 'ring', style: { '--p': p } }, h('b', {}, `${p}%`)),
          h('div', {}, h('div', { class: 'label' }, 'Release readiness'), h('div', { class: 'small' }, app.readyForRelease ? 'Ready for users' : `${toDo(app)} things left`))),
        h('div', { class: 'fact' }, h('div', { class: 'label' }, 'Launch steps'), h('div', { class: 'value' }, app.stepsDone, h('small', {}, ` / ${app.stepsTotal}`))),
        h('div', { class: 'fact' }, h('div', { class: 'label' }, 'Readiness checks'), h('div', { class: 'value' }, app.checksDone, h('small', {}, ` / ${app.checksTotal}`))),
        h('div', { class: 'fact' }, h('div', { class: 'label' }, 'Blocking release'), h('div', { class: 'value' + (app.blockingTasks ? ' bad' : '') }, app.blockingTasks)))),

    nextCard(app),

    h('section', { class: 'card' },
      h('div', { class: 'card-head' }, h('h2', {}, 'Launch steps'), h('span', { class: 'count' }, `${app.stepsDone}/${app.stepsTotal}`),
        h('span', { class: 'end sub' }, 'Claude runs these during onboarding')),
      h('div', { class: 'roadmap' }, app.steps.map((s) => {
        const st = s.status || 'todo';
        return h('div', { class: 'step ' + st, title: s.note || STEP_WORD[st] },
          h('div', { class: 'lbl' }, icon(STEP_ICON[st]), h('span', {}, s.label)),
          h('div', { class: 'note' }, s.stale ? 'Stalled: run it again'
            : st === 'todo' && s.waitingOn?.length ? `Waits on ${s.waitingOn.map((id) => app.steps.find((x) => x.id === id)?.label || id).join(', ')}`
            : s.note || (s.provider ? `${STEP_WORD[st]} · ${s.provider}` : STEP_WORD[st])));
      }))),

    h('div', { class: 'cols' },
      h('div', { class: 'stack' },
        h('section', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Your tasks'), h('span', { class: 'count' }, app.openTasks),
            h('span', { class: 'end sub' }, 'Release blockers first')),
          h('div', { class: 'card-body' },
            h('div', { class: 'rows' }, app.tasks.length ? app.tasks.map((t) => taskRow(app, t)) : h('div', { class: 'empty-row' }, icon('checkCircle'), 'Nothing waiting on you.')),
            h('form', { class: 'add', onsubmit: (e) => {
              e.preventDefault();
              if (!input.value.trim()) return;
              mutate(`/api/apps/${app.slug}/tasks`, 'POST', { title: input.value, blocksRelease: blocks.checked });
            } }, input, h('label', {}, blocks, 'Blocks release'), h('button', { class: 'btn primary', type: 'submit' }, icon('plus'), 'Add')))),

        h('section', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Release readiness'), h('span', { class: 'count' }, `${app.checksDone}/${app.checksTotal}`),
            h('span', { class: 'end' },
              h('span', { class: 'sub' }, app.lastVerifiedAt ? `Verified ${ago(app.lastVerifiedAt)}` : 'Not verified yet'),
              h('button', { class: 'btn', title: 'Check against the live site and connected services', onclick: (e) => { e.target.disabled = true; toast('Checking the live site and services…'); mutate(`/api/apps/${app.slug}/verify`, 'POST'); } }, icon('checkCircle'), 'Verify'))),
          cats.map((cat) => {
            const items = app.checklist.filter((c) => c.category === cat);
            const done = items.filter((c) => c.done).length;
            const key = openKey(cat);
            const isOpen = key in state.open ? state.open[key] : done < items.length && cats.indexOf(cat) < 2;
            return h('details', { class: 'cat', open: isOpen, ontoggle: (e) => { state.open[key] = e.target.open; } },
              h('summary', {}, icon('chevron', 'chev'), h('span', { class: 'nm' }, cat),
                h('div', { class: 'meter' }, h('span', { class: 'ok', style: { width: `${(done / items.length) * 100}%` } })),
                h('span', { class: 'frac' + (done === items.length ? ' full' : '') }, done === items.length ? 'Complete' : `${done} of ${items.length}`)),
              h('div', { class: 'items' }, items.map((c) => h('label', { class: 'check' },
                h('input', { type: 'checkbox', checked: c.done, onchange: (e) => mutate(`/api/apps/${app.slug}/checklist/${c.id}`, 'POST', { done: e.target.checked }) }),
                h('span', { class: 'tx' }, c.title, c.verify?.ok === false ? h('span', { class: 'why' }, c.verify.detail) : null),
                c.done && c.by ? h('span', { class: 'by' }, c.by === 'verified' ? 'verified' : `by ${c.by}`) : null))));
          }))),

      h('div', { class: 'stack' },
        pulseCard(app),
        h('section', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Deployments')),
          h('div', { class: 'card-body' },
            app.liveUrl ? h('a', { class: 'live-link', href: app.liveUrl, target: '_blank', rel: 'noopener' },
              h('span', { class: 'status-dot live' }), h('span', { class: 'host' }, host(app.liveUrl)), icon('external')) : null,
            app.deploys.length ? h('div', { class: 'rows' }, app.deploys.map((d) => h('div', { class: 'deploy' },
              h('span', { class: 'tile' }, icon(d.platform === 'web' ? 'globe' : 'phone')),
              h('div', { class: 'grow' }, h('div', { style: { fontWeight: 500 } }, d.target),
                h('div', { class: 'small' }, d.platform === 'web' ? 'Web' : `${PLATFORM[d.platform] || d.platform} · to your testers`, d.at ? ` · ${ago(d.at)}` : '')),
              h('div', { style: { textAlign: 'right' } },
                h('span', { class: 'pill sm ' + (d.status === 'live' ? 'good' : d.status === 'failed' ? 'bad' : 'run') }, h('span', { class: 'd' }), d.status === 'live' ? 'Live' : d.status),
                d.version ? h('div', { class: 'v', style: { marginTop: '3px' } }, d.version) : null))))
              : h('div', { class: 'empty-row' }, 'Nothing deployed yet.'))),
        h('section', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Accounts this app uses'),
            h('span', { class: 'end' }, h('button', { class: 'btn quiet', onclick: () => go('accounts') }, 'All accounts', icon('arrow')))),
          h('div', { class: 'card-body' }, accountRows(app.accounts))),
        h('section', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Activity')),
          h('div', { class: 'card-body' }, activity(app.log.map((l) => ({ ...l, app })), 8, false))))),
  ];
}

// ---------- plumbing ----------
function render() {
  const app = state.apps.find((a) => a.slug === state.selected);
  if (state.view === 'app' && !app && state.lastSync) state.view = 'overview';
  if (state.view === 'app' && !app) return renderNav();
  renderNav();
  renderTopbar(app);
  const view = state.view === 'app' ? renderApp(app) : state.view === 'accounts' ? renderAccounts() : renderOverview();
  $('main').replaceChildren(...[view].flat().filter(Boolean));
  document.title = state.view === 'app' ? `${app.name} · Mission Control` : 'Mission Control';
}

let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const el = h('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast(`Copied: ${text}`); }
  catch { toast(`Run: ${text}`); }
}

async function mutate(path, method, body) {
  try {
    await api(path, { method, body: body ? JSON.stringify(body) : undefined });
    await refresh(true);
  } catch (err) { toast(err.message); }
}

function go(view, slug = null) {
  state.view = view;
  state.selected = slug;
  history.replaceState(null, '', view === 'app' ? `#${slug}` : view === 'accounts' ? '#accounts' : '#');
  render();
  window.scrollTo(0, 0);
}

async function refresh(force) {
  try {
    const [apps, accounts] = await Promise.all([api('/api/apps'), api('/api/accounts')]);
    state.apps = apps;
    state.accounts = accounts;
    state.lastSync = Date.now();
  } catch (err) {
    if (force) toast(err.message);
    return;
  }
  // Don't clobber a half-typed task.
  const a = document.activeElement;
  if (force || a?.tagName !== 'INPUT' || a.type !== 'text') render();
}

$('nav-overview').onclick = () => go('overview');
$('nav-accounts').onclick = () => go('accounts');
const hash = decodeURIComponent(location.hash.slice(1));
if (hash === 'accounts') state.view = 'accounts';
else if (hash) { state.view = 'app'; state.selected = hash; }
render();
refresh(true);
setInterval(refresh, 4000);
</script>
</body>
</html>
